[package]
name = "infinite-canvas-desktop"
version = "0.20.0"
description = "无限画布桌面客户端"
authors = ["gitshang5018"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
# `_lib` 后缀避免 Windows 下与二进制名冲突，见 cargo#8519。
name = "infinite_canvas_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
